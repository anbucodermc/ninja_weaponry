plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    // Forge 26.2 uses ForgeGradle 7 (the "mavenizer" rewrite), NOT the classic FG6 userdev flow.
    id 'net.minecraftforge.gradle' version '7.0.32'
}

version = "${mod_version}"
group = "${mod_group}"

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    // Forge 26.2 compiles/runs on Java 25. The Gradle daemon itself runs on JDK 21
    // (org.gradle.java.home) because Gradle 8.x cannot launch on JDK 25.
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenCentral()
    // Forge's own maven + the Minecraft libraries maven, provided by the 'fg' extension.
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}
// The mavenizer repository serves the on-the-fly generated mapped Minecraft/Forge artifact.
minecraft.mavenizer(repositories)

// In a dev run the mod's compiled classes (build/classes/java/main) and processed resources
// (build/resources/main) live in separate directories. FML unifies them into one mod only if it
// is told they belong together via the fml.modFolders system property (format: modid%%path,
// entries separated by the platform path separator).
def _mainOutput = sourceSets.main.output
def modFoldersProp = (_mainOutput.classesDirs.files + [_mainOutput.resourcesDir])
        .findAll { it != null }
        .collect { "${mod_id}%%${it.absolutePath}" }
        .join(File.pathSeparator)

minecraft {
    // Official Mojang mappings at the 26.2 version.
    mappings 'official', "${mappings_version}"

    // FG7 run configurations. Each run declares the mod (source set) and sets fml.modFolders so
    // FML constructs the mod from the split dev output directories.
    runs {
        client {
            systemProperty 'fml.modFolders', modFoldersProp
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            systemProperty 'fml.modFolders', modFoldersProp
            mods { "${mod_id}" { source sourceSets.main } }
        }
        data {
            systemProperty 'fml.modFolders', modFoldersProp
            mods { "${mod_id}" { source sourceSets.main } }
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }
}

dependencies {
    // Register + consume the mavenized Forge dependency (returns a provider Gradle can resolve).
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Dev-run fix: FG7's dev launch registers only the resources output dir as the mod, so the split
// build/classes vs build/resources layout makes FML report the @Mod class "missing". Emitting
// processed resources into the classes directory puts mods.toml and the compiled mod class in one
// directory, which FML constructs into a single mod. (Harmless for the packaged jar.)
sourceSets.main.output.resourcesDir = sourceSets.main.java.classesDirectory

// Populate mods.toml / pack.mcmeta placeholders from gradle.properties.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id     : mod_id,
            mod_name   : mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_license: mod_license,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors
        ])
    }
}
